<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聖心節奏大師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #0F172A;
            font-family: 'Fredoka One', cursive;
            -webkit-user-select: none; user-select: none;
            overscroll-behavior: none;
        }

        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        canvas { display: block; touch-action: none; }

        .ui-layer {
            position: absolute;
            pointer-events: none; width: 100%; display: flex;
            justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 100;
        }

        .overlay {
            position: absolute;
            inset: 0; background: rgba(15, 23, 42, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: white;
            text-align: center; padding: 20px;
        }

        .level-selection-container {
            width: 100%;
            max-width: 600px; max-height: 35vh; overflow-y: auto;
            padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px;
        }

        .level-card {
            background: #0EA5E9;
            padding: 15px; border-radius: 20px; cursor: pointer;
            box-shadow: 0 6px 0 #0284C7; border: 3px solid white; transition: transform 0.1s;
        }
        .level-card:active { transform: scale(0.95); }

        .btn-primary {
            background: #F472B6;
            color: white; padding: 12px 30px; border-radius: 50px;
            font-size: 20px; cursor: pointer; box-shadow: 0 6px 0 #BE185D; border: none; margin: 5px;
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.95); box-shadow: 0 3px 0 #BE185D; }

        .settings-panel {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px; padding: 20px; margin-bottom: 20px; width: 100%; max-width: 420px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .mic-visualizer-bg {
            width: 100%; height: 14px; background: rgba(0,0,0,0.3); border-radius: 7px;
            overflow: hidden; margin-top: 5px; position: relative;
        }
        #mic-visualizer-fill { width: 0%; height: 100%; background: #4ADE80; transition: width 0.05s; }
        #threshold-marker {
            position: absolute; top: 0; bottom: 0; width: 3px; background: #F87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 1); z-index: 10;
        }

        .custom-slider {
            -webkit-appearance: none; flex-grow: 1; height: 10px; border-radius: 5px;
            background: rgba(0, 0, 0, 0.4); outline: none;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
            background: #FDE047; cursor: pointer; border: 3px solid #FFF;
        }

        .heart-icon {
            display: inline-block; width: 22px; height: 22px; background-color: #EF4444;
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
            margin-right: 3px;
        }
        .heart-lost { background-color: #64748b; opacity: 0.3; }

        @keyframes stamp { 0% { transform: scale(3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .rank-stamp { animation: stamp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        #mic-error-msg { font-size: 10px; color: #FB7185; text-align: center; display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- P1 頂部介面 -->
    <div class="ui-layer" id="game-ui-p1" style="display: none; top: env(safe-area-inset-top, 20px);">
        <div class="flex flex-col gap-1">
            <div class="text-sm text-green-300 font-bold tracking-widest">P1 [Space]</div>
            <div id="score-display-p1" class="text-2xl text-white font-bold" style="text-shadow: 2px 2px 0px rgba(0,0,0,0.5);">SCORE: 0</div>
            <div id="hearts-container-p1" class="flex"></div>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div id="status-display-p1" class="text-3xl text-green-400 font-bold" style="text-shadow: 2px 2px 0px rgba(0,0,0,0.5);">READY?</div>
            <div class="difficulty-indicator text-xs font-bold px-3 py-1 rounded-full text-white bg-slate-800/50">演奏</div>
        </div>
    </div>

    <!-- P2 底部介面 -->
    <div class="ui-layer" id="game-ui-p2" style="display: none; top: auto; bottom: env(safe-area-inset-bottom, 20px);">
        <div class="flex flex-col gap-1">
            <div id="hearts-container-p2" class="flex"></div>
            <div id="score-display-p2" class="text-2xl text-white font-bold" style="text-shadow: 2px 2px 0px rgba(0,0,0,0.5);">SCORE: 0</div>
            <div class="text-sm text-pink-300 font-bold tracking-widest">P2 [Enter]</div>
        </div>
        <div class="flex flex-col items-end gap-1 justify-end">
            <div class="difficulty-indicator text-xs font-bold px-3 py-1 rounded-full text-white bg-slate-800/50">演奏</div>
            <div id="status-display-p2" class="text-3xl text-pink-400 font-bold" style="text-shadow: 2px 2px 0px rgba(0,0,0,0.5);">READY?</div>
        </div>
    </div>

    <!-- 中央預備拍大字指示器 -->
    <div id="prep-counter" class="absolute left-1/2 top-1/4 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none z-50 select-none" style="display: none;">
        <div id="prep-text" class="font-black tracking-wider transition-all duration-100 drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)]" style="font-size: 11rem; text-shadow: 8px 8px 0px #0F172A;">1</div>
        <div class="text-lg md:text-2xl text-white font-bold bg-indigo-600/90 border-2 border-indigo-300 px-8 py-3 rounded-full mt-2 shadow-xl tracking-wider uppercase whitespace-nowrap">預備拍：聽音樂準備（不需打擊）</div>
    </div>

    <!-- P1 & P2 動態回饋與 Combo -->
    <div id="combo-display-p1" class="absolute left-1/2 -translate-x-1/2 text-4xl text-green-300 font-bold z-50 pointer-events-none" style="display: none; text-shadow: 3px 3px 0 #064E3B;">0 COMBO</div>
    <div id="feedback-p1" class="absolute left-1/2 -translate-x-1/2 text-[60px] font-bold text-yellow-300 pointer-events-none z-[200] opacity-0 transition-all duration-150" style="text-shadow: 4px 4px 0px rgba(0,0,0,0.5);">GREAT!</div>

    <div id="combo-display-p2" class="absolute left-1/2 -translate-x-1/2 text-4xl text-pink-300 font-bold z-50 pointer-events-none" style="display: none; text-shadow: 3px 3px 0 #831843;">0 COMBO</div>
    <div id="feedback-p2" class="absolute left-1/2 -translate-x-1/2 text-[60px] font-bold text-yellow-300 pointer-events-none z-[200] opacity-0 transition-all duration-150" style="text-shadow: 4px 4px 0px rgba(0,0,0,0.5);">GREAT!</div>

    <canvas id="gameCanvas"></canvas>

    <!-- 首頁選單 -->
    <div id="menu-screen" class="overlay">
        <h1 class="text-5xl md:text-6xl mb-2 font-bold text-white tracking-widest" style="text-shadow: 4px 4px 0px #0284C7;">聖心節奏大師</h1>
        <p class="text-sm md:text-lg mb-4 text-sky-200 font-bold">一起探索宇宙的節奏！</p>
        
        <!-- 新增：遊戲模式選擇 -->
        <div class="flex gap-4 justify-center mb-4">
            <div id="btn-mode-single" class="px-6 py-2 rounded-xl bg-purple-500 cursor-pointer font-bold text-white border-4 border-white shadow-lg" onclick="setMode('single')">單人挑戰</div>
            <div id="btn-mode-pvp" class="px-6 py-2 rounded-xl bg-indigo-500 cursor-pointer font-bold text-white border-4 border-transparent shadow-lg" onclick="setMode('pvp')">雙人對戰</div>
        </div>

        <div class="settings-panel">
            <div class="flex justify-between items-center mb-1">
                <span class="text-white font-bold text-sm uppercase">🎤 聲控感應靈敏度 (限單人使用)</span>
                <button id="calib-btn-ui" class="calibrate-btn bg-blue-600 px-3 py-1 rounded text-xs font-bold" onclick="calibrateNoise()">環境校準</button>
            </div>
            <div class="flex gap-4 items-center">
                <input type="range" id="mic-slider" class="custom-slider" min="5" max="80" value="25" oninput="updateSettings()">
                <span id="mic-val" class="text-yellow-300 text-xs w-6">25</span>
            </div>
            <div class="mic-visualizer-bg">
                <div id="mic-visualizer-fill"></div>
                <div id="threshold-marker"></div>
            </div>
            <div id="mic-error-msg">⚠️ 麥克風未開啟，請使用鍵盤或點擊螢幕</div>
            
            <div class="flex justify-between items-center mt-2">
                <span class="text-white font-bold text-sm">🎵 節拍與打擊音效</span>
            </div>
            <input type="range" id="vol-slider" class="custom-slider" min="0" max="100" value="40" oninput="updateSettings()">
        </div>

        <div class="flex gap-2 mb-4">
            <div id="btn-practice" class="px-4 py-2 rounded-xl bg-emerald-500 cursor-pointer font-bold text-sm border-2 border-transparent" onclick="setDifficulty('practice')">練習</div>
            <div id="btn-performance" class="px-4 py-2 rounded-xl bg-amber-500 cursor-pointer font-bold text-sm border-2 border-white" onclick="setDifficulty('performance')">標準</div>
            <div id="btn-master" class="px-4 py-2 rounded-xl bg-red-500 cursor-pointer font-bold text-sm border-2 border-transparent" onclick="setDifficulty('master')">大師</div>
        </div>

        <div class="level-selection-container" id="level-selection"></div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="overlay" style="display: none;">
        <h2 id="result-title" class="text-4xl md:text-5xl mb-6 font-bold tracking-widest text-white drop-shadow-lg">挑戰完成！</h2>
        
        <!-- 動態注入的成績板內容 -->
        <div id="result-content" class="w-full max-w-3xl flex flex-col md:flex-row items-center justify-center gap-6"></div>
        
        <div class="flex flex-col gap-3 w-64 mt-8">
            <button class="btn-primary" onclick="restartLevel()">再次挑戰</button>
            <button class="btn-primary" style="background: #34D399; box-shadow: 0 6px 0 #059669;" onclick="backToMenu()">返回首頁</button>
        </div>
    </div>
</div>

<script>
    const BPM = 75;
    const SECONDS_PER_BEAT = 60 / BPM;
    
    let BASE_UNIT = 220; 
    let START_LINE_X = 180; 
    
    let currentPhrasesCount = 12;
    const INITIAL_HP = 8;

    const DIFFICULTY_SETTINGS = {
        practice: { name: "練習", perfect: 0.20, great: 0.35, color: "#10B981" },
        performance: { name: "演奏", perfect: 0.12, decay: 0.25, color: "#F59E0B" },
        master: { name: "大師", perfect: 0.06, great: 0.15, color: "#EF4444" }
    };

    const RANK_DATA = [
        { min: 0.95, letter: 'S+', title: '彩虹怪獸之神', color: '#FDE047' },
        { min: 0.85, letter: 'S', title: '頂級打擊節奏圈', color: '#FACC15' },
        { min: 0.75, letter: 'A', title: '金牌節奏電路', color: '#FB923C' },
        { min: 0.60, letter: 'B', title: '派對核心怪獸', color: '#60A5FA' },
        { min: 0.40, letter: 'C', title: '初生代小機器人', color: '#94A3B8' },
        { min: 0.00, letter: 'D', title: '待機中的黑洞', color: '#64748B' }
    ];

    let gameMode = 'single'; // 'single' 或 'pvp'
    let currentDifficulty = 'performance';
    let currentLevel = 1;
    let totalPossibleScore = 0;
    
    let isGameRunning = false;
    let gameState = 'MENU'; 
    let startTime = 0;
    let lastPlayedBeat = -1;
    
    let micSensitivity = 25; 
    let masterVolume = 0.4; 
    let noiseFloor = 0; 
    let lastInputTime = 0;
    let lastPeak = 0;
    let isCalibrating = false;
    let micAvailable = false;

    let audioCtx, analyser, dataArray, micStream;
    let globalPlatforms = [];
    let backgroundStars = [];

    // 🚀 多玩家架構支援
    let players = [];

    function createPlayerState(id, colorTheme) {
        return {
            id: id, color: colorTheme,
            score: 0, hp: INITIAL_HP, combo: 0, maxCombo: 0,
            expression: 'normal', expressionTimer: 0, visible: true,
            isFalling: false, fallY: 0, fallVy: 0, rotation: 0,
            isWaving: false, ascendY: 0,
            state: 'playing', // 'playing', 'falling', 'failed', 'escaping', 'escaped'
            ufoAnimation: { active: false, timer: 0, ufoY: -200, ufoX: 0, stage: 'descend', particles: [] },
            notes: [], y: 0, scale: 1, x: 0
        };
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const prepCounter = document.getElementById('prep-counter');
    const prepText = document.getElementById('prep-text');
    const resultScreen = document.getElementById('result-screen');
    const menuScreen = document.getElementById('menu-screen');

    function setMode(mode) {
        gameMode = mode;
        document.getElementById('btn-mode-single').style.borderColor = mode === 'single' ? 'white' : 'transparent';
        document.getElementById('btn-mode-pvp').style.borderColor = mode === 'pvp' ? 'white' : 'transparent';
        resize(); // 套用視覺版面更新
    }

    function resize() {
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;
        
        let sidePadding = Math.min(canvas.width * 0.12, 120); 
        START_LINE_X = sidePadding;
        BASE_UNIT = (canvas.width - sidePadding * 2) / 4; 

        // 動態分配玩家位置與縮放
        if (gameMode === 'single') {
            if (players[0]) {
                players[0].y = canvas.height * 0.62;
                players[0].scale = 1;
            }
            prepCounter.style.top = '25%';
        } else {
            if (players[0]) {
                players[0].y = canvas.height * 0.30;
                players[0].scale = 0.65;
            }
            if (players[1]) {
                players[1].y = canvas.height * 0.78;
                players[1].scale = 0.65;
            }
            prepCounter.style.top = '50%';
        }

        backgroundStars = Array.from({length: 60}, () => ({
            x: Math.random(),
            y: Math.random() * (gameMode === 'single' ? 0.35 : 0.18), 
            size: Math.random() * 2.5 + 0.5,
            offset: Math.random() * 100
        }));
    }
    window.addEventListener('resize', resize); resize();

    const levelsData = [
        { id: 0, name: "教學：基礎拍子", patterns: [['ta', 'ta', 'ta', 'ta']], phrases: 4 },
        { id: 1, name: "入門節奏", patterns: [['ta', 'ta', 'ta', 'ta'], ['ta', 'rest', 'ta', 'rest']], phrases: 12 },
        { id: 2, name: "雙音練習", patterns: [['ta', 'ti', 'ta', 'ti'], ['ti', 'ti', 'ta', 'ta']], phrases: 12 },
        { id: 3, name: "切分初探", patterns: [['ti', 'ti', 'ta', 'rest'], ['ta', 'ti', 'ti', 'ta']], phrases: 12 },
        { id: 4, name: "快速連打", patterns: [['ta', 'tiritiri', 'ta', 'ta'], ['tiritiri', 'ti', 'ta', 'rest']], phrases: 12 },
        { id: 5, name: "輕快組合", patterns: [['ti-tiri', 'ta', 'ti-tiri', 'ta'], ['ta', 'ti-tiri', 'ti', 'ti']], phrases: 12 },
        { id: 6, name: "大師律動", patterns: [['ti-ri', 'ta', 'ti-ri', 'ta'], ['ti-ri', 'ti-tiri', 'ta', 'ta']], phrases: 12 }
    ];

    function updateSettings() {
        micSensitivity = parseInt(document.getElementById('mic-slider').value);
        document.getElementById('mic-val').innerText = micSensitivity;
        const totalThreshold = Math.min(98, noiseFloor + micSensitivity);
        document.getElementById('threshold-marker').style.left = totalThreshold + '%';
        masterVolume = parseInt(document.getElementById('vol-slider').value) / 100;
    }

    async function calibrateNoise() {
        const success = await initAudio();
        if (!success || isCalibrating) return;
        isCalibrating = true;
        let samples = []; const startCalib = Date.now();
        const sampleTask = setInterval(() => {
            analyser.getByteFrequencyData(dataArray);
            let peak = 0; for(let j=0; j<dataArray.length; j++) if(dataArray[j] > peak) peak = dataArray[j];
            samples.push(peak);
            if (Date.now() - startCalib > 1000) {
                clearInterval(sampleTask);
                samples.sort((a, b) => b - a);
                const avgPeak = samples.slice(0, Math.floor(samples.length * 0.1)).reduce((a, b) => a + b, 0) / (samples.length * 0.1);
                noiseFloor = (avgPeak / 255) * 100; isCalibrating = false; updateSettings();
            }
        }, 30);
    }

    function initHearts(p) {
        const container = document.getElementById(`hearts-container-p${p.id}`);
        container.innerHTML = '';
        for (let i = 0; i < INITIAL_HP; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-icon'; container.appendChild(heart);
        }
    }

    function setDifficulty(diff) {
        currentDifficulty = diff;
        ['practice', 'performance', 'master'].forEach(d => {
            document.getElementById(`btn-${d}`).style.borderColor = (d === diff) ? 'white' : 'transparent';
        });
        document.querySelectorAll('.difficulty-indicator').forEach(el => {
            el.innerText = DIFFICULTY_SETTINGS[diff].name;
            el.style.backgroundColor = DIFFICULTY_SETTINGS[diff].color;
        });
        initMenu();
    }

    function initMenu() {
        const grid = document.getElementById('level-selection');
        grid.innerHTML = '';
        levelsData.forEach(lvl => {
            const best = localStorage.getItem(`best_score_lvl_${lvl.id}_${currentDifficulty}`) || 0;
            const card = document.createElement('div'); card.className = 'level-card';
            card.onclick = () => startLevel(lvl.id);
            card.innerHTML = `<div class="text-[10px] text-white opacity-80 font-bold">LV 0${lvl.id}</div><div class="text-lg font-bold text-white leading-tight">${lvl.name}</div><div class="text-[10px] text-sky-100 font-bold mt-1">BEST: ${best}</div>`;
            grid.appendChild(card);
        });
        updateSettings();
    }

    async function initAudio() {
        if (micAvailable && audioCtx) return true;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(micStream);
            const filter = audioCtx.createBiquadFilter(); filter.type = "highpass"; filter.frequency.value = 400; 
            source.connect(filter); filter.connect(analyser);
            analyser.fftSize = 512; dataArray = new Uint8Array(analyser.frequencyBinCount);
            micAvailable = true; document.getElementById('mic-error-msg').style.display = 'none'; monitorMic(); return true;
        } catch (err) { 
            micAvailable = false; document.getElementById('mic-error-msg').style.display = 'block'; return false;
        }
    }

    function monitorMic() {
        if (!analyser || !micAvailable) return;
        analyser.getByteFrequencyData(dataArray);
        let peak = 0; for(let i=0; i<dataArray.length; i++) if(dataArray[i] > peak) peak = dataArray[i];
        const currentVolume = (peak / 255) * 100;
        const totalThreshold = Math.max(10, noiseFloor + micSensitivity);
        document.getElementById('mic-visualizer-fill').style.width = currentVolume + '%';
        const now = Date.now();
        if (currentVolume > totalThreshold && currentVolume - lastPeak > 5 && now - lastInputTime > 110) {
            // 麥克風只支援單人模式控制 P1
            if (isGameRunning && gameMode === 'single' && players[0]) handleInput(players[0]);
            document.getElementById('mic-visualizer-fill').style.background = '#F87171'; lastInputTime = now;
        } else { document.getElementById('mic-visualizer-fill').style.background = '#4ADE80'; }
        lastPeak = currentVolume; requestAnimationFrame(monitorMic);
    }

    function playHitSound() {
        if (!audioCtx || masterVolume <= 0) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(masterVolume * 0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function playMetronomeSound(isDownbeat) {
        if (!audioCtx || masterVolume <= 0) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        const targetFreq = isDownbeat ? 1800 : 1200;
        osc.frequency.setValueAtTime(targetFreq, audioCtx.currentTime);
        gain.gain.setValueAtTime(masterVolume * 0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playUfoSound(isFlyUp) {
        if (!audioCtx || masterVolume <= 0) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(isFlyUp ? 180 : 600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(isFlyUp ? 1200 : 200, audioCtx.currentTime + 1.2);
        gain.gain.setValueAtTime(masterVolume * 0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.2);
    }

    function getColorStage(currentCombo) {
        if (currentCombo >= 40) return 'rainbow';
        if (currentCombo >= 25) return '#F472B6'; 
        if (currentCombo >= 15) return '#FB923C'; 
        if (currentCombo >= 8)  return '#38BDF8'; 
        return '#FFFFFF';
    }

    function generateLevel(levelId) {
        globalPlatforms = [];
        totalPossibleScore = 0;
        const lvlInfo = levelsData.find(l => l.id === levelId);
        currentPhrasesCount = lvlInfo.phrases || 12; 
        
        for (let p = 0; p < currentPhrasesCount; p++) {
            let startBeat = p * 8; 
            globalPlatforms.push({ phrase: p, index: 0, type: 'count_in', width: BASE_UNIT * 0.85 });
            
            let selectedPattern = lvlInfo.patterns[Math.floor(Math.random() * lvlInfo.patterns.length)];
            
            let noteAddedThisLoop = false;
            selectedPattern.forEach((noteType, idx) => {
                let localBeatIndex = 4 + idx; 
                globalPlatforms.push({ phrase: p, index: idx + 1, type: 'challenge', width: BASE_UNIT * 0.85, noteType });
                
                const addNote = (time, subPos, beam = 0) => {
                    players.forEach(player => {
                        player.notes.push({ phrase: p, index: idx + 1, time, type: noteType, hit: false, subPos, beamToNext: beam });
                    });
                    noteAddedThisLoop = true;
                };
                
                if (noteType === 'ta' || noteType === 'rest') addNote(startBeat + localBeatIndex, 0);
                else if (noteType === 'ti') { addNote(startBeat + localBeatIndex, -0.16, 1); addNote(startBeat + localBeatIndex + 0.5, 0.16); }
                else if (noteType === 'tiritiri') { addNote(startBeat + localBeatIndex, -0.25, 2); addNote(startBeat + localBeatIndex + 0.25, -0.08, 2); addNote(startBeat + localBeatIndex + 0.5, 0.08, 2); addNote(startBeat + localBeatIndex + 0.75, 0.25); }
                else if (noteType === 'ti-tiri') { addNote(startBeat + localBeatIndex, -0.22, 1); addNote(startBeat + localBeatIndex + 0.5, 0.05, 2); addNote(startBeat + localBeatIndex + 0.75, 0.25); }
                else if (noteType === 'ti-ri') { addNote(startBeat + localBeatIndex, -0.16, 1); addNote(startBeat + localBeatIndex + 0.75, 0.22); }
            });
        }
        if (players.length > 0) {
            totalPossibleScore = players[0].notes.filter(n => n.type !== 'rest').length * 100;
        }
    }

    async function startLevel(id) {
        await initAudio();
        currentLevel = id; 
        players = [];
        
        // 建立 P1
        players.push(createPlayerState(1, '#4ADE80'));
        if (gameMode === 'pvp') {
            // 建立 P2
            players.push(createPlayerState(2, '#F472B6'));
        }

        generateLevel(currentLevel); 
        resize(); // 動態定位與縮放
        
        players.forEach(p => initHearts(p));
        
        menuScreen.style.display = 'none';
        resultScreen.style.display = 'none';
        
        document.getElementById('game-ui-p1').style.display = 'flex';
        document.getElementById('combo-display-p1').style.display = 'block';
        
        if (gameMode === 'pvp') {
            document.getElementById('game-ui-p2').style.display = 'flex';
            document.getElementById('combo-display-p2').style.display = 'block';
        } else {
            document.getElementById('game-ui-p2').style.display = 'none';
            document.getElementById('combo-display-p2').style.display = 'none';
        }

        startTime = Date.now(); isGameRunning = true; gameState = 'PLAYING';
        lastPlayedBeat = -1;
        requestAnimationFrame(gameLoop);
    }

    function checkGameEnd() {
        let allDone = true;
        players.forEach(p => {
            if (p.state === 'playing' || p.state === 'escaping' || p.state === 'falling') {
                allDone = false;
            }
        });
        if (allDone && isGameRunning) {
            showResults();
        }
    }

    function handleInput(p) {
        if (!isGameRunning || gameState !== 'PLAYING' || p.ufoAnimation.active || p.state !== 'playing') return;
        const currentBeatFloat = Math.max(0, (Date.now() - startTime) / 1000) / SECONDS_PER_BEAT;
        let closest = null; let minDist = Infinity;
        p.notes.forEach(n => {
            if (n.hit || n.missed || n.type === 'rest') return;
            let dist = Math.abs(currentBeatFloat - n.time) * SECONDS_PER_BEAT;
            if (dist < minDist) { minDist = dist; closest = n; }
        });
        const sets = DIFFICULTY_SETTINGS[currentDifficulty];
        if (closest && minDist < (sets.great || 0.25)) {
            playHitSound();
            closest.hit = true; p.combo++;
            if (p.combo > p.maxCombo) p.maxCombo = p.combo;
            const isPerf = minDist < sets.perfect; p.score += isPerf ? 100 : 50;
            
            const comboEl = document.getElementById(`combo-display-p${p.id}`);
            comboEl.innerText = `${p.combo} COMBO`; 
            p.expression = isPerf ? 'perfect' : 'happy';
            p.expressionTimer = 25; 
            const sc = getColorStage(p.combo);
            comboEl.style.color = sc === 'rainbow' ? '#FFF' : sc;
            
            showFeedback(p, isPerf ? "PERFECT!" : "GREAT!", isPerf ? "#FDE047" : "#FFFFFF");
        } else { takeDamage(p); }
    }

    function takeDamage(p) {
        if (p.ufoAnimation.active || p.state !== 'playing') return;
        p.combo = 0; 
        document.getElementById(`combo-display-p${p.id}`).innerText = `0 COMBO`;
        p.expression = 'dizzy'; 
        p.expressionTimer = 35;
        showFeedback(p, "MISS!", "#EF4444");

        if (currentDifficulty === 'practice') return;

        if (p.hp <= 0) return;
        p.hp--; 
        const hearts = document.getElementById(`hearts-container-p${p.id}`).children; 
        if (hearts[p.hp]) hearts[p.hp].classList.add('heart-lost');
        
        if (p.hp <= 0) {
            p.isFalling = true;
            p.state = 'falling';
            p.fallVy = -6; 
        }
    }

    function showFeedback(p, txt, color) {
        const el = document.getElementById(`feedback-p${p.id}`);
        el.innerText = txt;
        el.style.color = color;
        el.style.opacity = 1;
        el.style.transform = 'translate(-50%, -50%) scale(1.2)';
        
        if (p.feedbackTimeout) clearTimeout(p.feedbackTimeout);
        p.feedbackTimeout = setTimeout(() => { 
            el.style.opacity = 0; 
            el.style.transform = 'translate(-50%, -50%) scale(1)'; 
        }, 300);
    }

    function showResults() {
        isGameRunning = false;
        gameState = 'RESULT'; 
        document.getElementById('game-ui-p1').style.display = 'none'; 
        document.getElementById('game-ui-p2').style.display = 'none'; 
        document.getElementById('combo-display-p1').style.display = 'none';
        document.getElementById('combo-display-p2').style.display = 'none';
        prepCounter.style.display = 'none';
        
        let resultContent = '';
        const bestKeyBase = `best_score_lvl_${currentLevel}_${currentDifficulty}`;

        if (gameMode === 'single') {
            let p = players[0];
            const failed = p.state === 'failed';
            const scoreRatio = failed ? 0 : p.score / (totalPossibleScore || 1);
            const rank = RANK_DATA.find(r => scoreRatio >= r.min) || RANK_DATA[RANK_DATA.length - 1];
            
            let best = localStorage.getItem(bestKeyBase) || 0;
            if (!failed && p.score > best) { best = p.score; localStorage.setItem(bestKeyBase, p.score); }
            
            document.getElementById('result-title').innerText = failed ? "挑戰失敗" : "完成挑戰！";
            
            resultContent = `
                <div id="rank-container" class="mb-6 flex flex-col items-center w-full md:w-auto">
                    <div class="rank-stamp text-8xl font-black italic drop-shadow-lg leading-none" style="color: ${failed ? '#EF4444' : rank.color}">${failed ? 'F' : rank.letter}</div>
                    <div class="mt-4 px-6 py-2 rounded-full font-bold text-xl shadow-lg" style="background-color: ${failed ? '#475569' : rank.color}; color: ${!failed && rank.letter.includes('S') ? '#000' : '#FFF'}">${failed ? '墜入黑洞的機器人' : rank.title}</div>
                </div>
                <div class="bg-white p-6 rounded-3xl text-slate-800 w-72 shadow-2xl relative overflow-hidden">
                    <p class="text-2xl mb-1 font-bold">得分：<span class="text-green-500">${p.score}</span></p>
                    <p class="text-sm text-slate-500 font-bold">MAX COMBO: <span class="text-blue-500">${p.maxCombo}</span></p>
                    <div class="h-[1px] bg-slate-100 my-3"></div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Best Score: <span>${best}</span></p>
                </div>
            `;
        } else {
            // PVP 對戰結果結算
            let p1 = players[0];
            let p2 = players[1];
            let winnerText = "";
            if (p1.score > p2.score) winnerText = "🏆 Player 1 獲勝！";
            else if (p2.score > p1.score) winnerText = "🏆 Player 2 獲勝！";
            else winnerText = "🤝 平局！";
            
            document.getElementById('result-title').innerText = "對戰結束！";
            
            resultContent = `
                <div class="w-full flex flex-col items-center">
                    <h3 class="text-4xl font-bold text-yellow-300 mb-6 drop-shadow-md tracking-wider">${winnerText}</h3>
                    <div class="flex flex-col md:flex-row gap-6 w-full justify-center">
                        <div class="bg-white/10 p-6 rounded-2xl w-64 border-4 ${p1.score >= p2.score && p1.score > 0 ? 'border-yellow-400' : 'border-transparent'} shadow-xl backdrop-blur-sm">
                            <div class="text-2xl font-black text-green-400 mb-2">P1 (綠怪獸)</div>
                            <div class="text-sm font-bold text-white bg-slate-800/80 py-1 px-2 inline-block rounded mb-4">狀態: ${p1.state === 'escaped' ? '✅ 成功通關' : '❌ 墜入黑洞'}</div>
                            <div class="text-5xl font-black text-white mb-2 drop-shadow-md">${p1.score}</div>
                            <div class="text-sm text-slate-300 font-bold">MAX COMBO: ${p1.maxCombo}</div>
                        </div>
                        <div class="bg-white/10 p-6 rounded-2xl w-64 border-4 ${p2.score >= p1.score && p2.score > 0 ? 'border-yellow-400' : 'border-transparent'} shadow-xl backdrop-blur-sm">
                            <div class="text-2xl font-black text-pink-400 mb-2">P2 (粉怪獸)</div>
                            <div class="text-sm font-bold text-white bg-slate-800/80 py-1 px-2 inline-block rounded mb-4">狀態: ${p2.state === 'escaped' ? '✅ 成功通關' : '❌ 墜入黑洞'}</div>
                            <div class="text-5xl font-black text-white mb-2 drop-shadow-md">${p2.score}</div>
                            <div class="text-sm text-slate-300 font-bold">MAX COMBO: ${p2.maxCombo}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        document.getElementById('result-content').innerHTML = resultContent;
        resultScreen.style.display = 'flex';
    }

    function backToMenu() { resultScreen.style.display = 'none'; menuScreen.style.display = 'flex'; initMenu(); }
    function restartLevel() { startLevel(currentLevel); }

    function drawPlatform(platform, screenX, screenY, scale) {
        const w = platform.width * scale;
        ctx.fillStyle = '#475569'; 
        ctx.beginPath(); ctx.roundRect(screenX - w/2, screenY + 12 * scale, w, 18 * scale, 8 * scale); ctx.fill();
        ctx.fillStyle = '#A3E635'; 
        ctx.beginPath(); ctx.roundRect(screenX - w/2, screenY, w, 20 * scale, 8 * scale); ctx.fill();

        if (platform.type === 'challenge') {
            ctx.fillStyle = '#FBBF24';
            ctx.beginPath(); let bx = screenX; let by = screenY + 16 * scale;
            ctx.moveTo(bx, by - 6 * scale); ctx.lineTo(bx + 8 * scale, by); ctx.lineTo(bx, by + 6 * scale); ctx.lineTo(bx - 8 * scale, by);
            ctx.closePath(); ctx.fill();
        }
    }

    function drawPlayerRobot(p, x, y, jumpHeight, rotation = 0) {
        if (!p.visible) return;
        
        p.scaleX = p.scaleX || 1.0; p.scaleY = p.scaleY || 1.0;
        p.scaleX += (1.0 - p.scaleX) * 0.15; p.scaleY += (1.0 - p.scaleY) * 0.15;
        if (p.expressionTimer > 0 && !p.isFalling) { 
            p.expressionTimer--;
            if (p.expressionTimer === 0) p.expression = 'normal'; 
        }
        
        let baseColor = p.color;
        const sc = getColorStage(p.combo);
        if (sc === 'rainbow' && !p.isFalling) baseColor = `hsl(${(Date.now() / 20) % 360}, 85%, 60%)`;
        else if (sc !== '#FFFFFF' && !p.isFalling && p.combo >= 8) baseColor = sc;

        ctx.save(); 
        ctx.translate(x, y + jumpHeight + p.ascendY - 12 * p.scale); 
        if (rotation !== 0) { ctx.rotate(rotation); }
        ctx.scale(p.scaleX * 1.5 * p.scale, p.scaleY * 1.5 * p.scale);

        ctx.strokeStyle = baseColor; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -65); ctx.lineTo(0, -80); ctx.stroke();
        ctx.fillStyle = baseColor; ctx.beginPath(); ctx.arc(0, -84, 6, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -84, 3, 0, Math.PI*2); ctx.stroke();
        
        ctx.fillStyle = baseColor; ctx.beginPath(); ctx.roundRect(-24, -65, 48, 75, 24); ctx.fill();
        
        ctx.fillRect(-30, -42, 8, 6); ctx.fillRect(-30, -25, 8, 6); 
        
        if (p.isWaving) {
            ctx.save(); ctx.translate(22, -39); ctx.rotate(Math.sin(Date.now() / 100) * 0.8 - 0.5); ctx.fillRect(0, -3, 8, 6); ctx.restore();
        } else {
            ctx.fillRect(22, -42, 8, 6); 
        }
        ctx.fillRect(22, -25, 8, 6);

        ctx.fillStyle = '#FDE047'; ctx.beginPath(); ctx.roundRect(-15, -32, 30, 26, 6); ctx.fill();
        ctx.fillStyle = '#EF4444'; ctx.fillRect(-9, -27, 6, 4); ctx.fillRect(3, -27, 6, 4);
        ctx.fillStyle = '#EC4899'; ctx.fillRect(-9, -18, 6, 4); ctx.fillRect(3, -18, 6, 4);

        ctx.fillStyle = '#1E293B';
        if (p.expression === 'dizzy' || p.isFalling) {
            ctx.strokeStyle = '#1E293B'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-13, -52); ctx.lineTo(-5, -44); ctx.moveTo(-5, -52); ctx.lineTo(-13, -44); ctx.moveTo(5, -52); ctx.lineTo(13, -44); ctx.moveTo(13, -52); ctx.lineTo(5, -44); ctx.stroke();
        } else if (p.expression === 'perfect' || p.expression === 'happy') {
            ctx.beginPath(); ctx.arc(-9, -48, 5, 0, Math.PI*2); ctx.arc(9, -48, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(-10, -50, 1.5, 0, Math.PI*2); ctx.arc(8, -50, 1.5, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(-9, -48, 3.5, 0, Math.PI*2); ctx.arc(9, -48, 3.5, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = '#1E293B'; ctx.beginPath();
        if (p.expression === 'perfect' || p.expression === 'happy') ctx.arc(0, -40, 4, 0, Math.PI);
        else ctx.rect(-5, -40, 10, 2.5);
        ctx.fill();
        ctx.fillStyle = baseColor; ctx.fillRect(-14, 10, 7, 12); ctx.fillRect(7, 10, 7, 12);
        ctx.restore();
    }

    function drawUFO(p, x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(p.scale, p.scale);

        if (p.ufoAnimation.stage !== 'fly') {
            let gradient = ctx.createLinearGradient(0, 0, 0, 180);
            if (p.ufoAnimation.stage === 'wave' || p.ufoAnimation.stage === 'ascend') {
                gradient.addColorStop(0, 'rgba(165, 243, 252, 0.7)'); gradient.addColorStop(1, 'rgba(165, 243, 252, 0)');
            } else {
                gradient.addColorStop(0, 'rgba(253, 224, 71, 0.5)'); gradient.addColorStop(1, 'rgba(253, 224, 71, 0)');
            }
            ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.moveTo(-45, 10); ctx.lineTo(45, 10); ctx.lineTo(80, 200); ctx.lineTo(-80, 200); ctx.closePath(); ctx.fill();
        }

        ctx.fillStyle = '#A5F3FC'; ctx.beginPath(); ctx.arc(0, -10, 38, Math.PI, 0); ctx.fill();

        if (p.ufoAnimation.stage === 'fly') {
            ctx.save(); ctx.translate(0, -15); ctx.scale(0.5, 0.5);
            p.visible = true; drawPlayerRobot(p, 0, 0, 0, 0); p.visible = false;
            ctx.restore();
        }

        ctx.fillStyle = '#F472B6'; ctx.beginPath(); ctx.ellipse(0, 5, 75, 22, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#EC4899'; ctx.fillRect(-65, 0, 130, 5);

        ctx.fillStyle = '#FDE047'; ctx.beginPath();
        ctx.arc(-45, 5, 4, 0, Math.PI*2); ctx.arc(-20, 5, 4, 0, Math.PI*2);
        ctx.arc(0, 5, 4, 0, Math.PI*2); ctx.arc(20, 5, 4, 0, Math.PI*2); ctx.arc(45, 5, 4, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function updateAndDrawParticles(p) {
        if (p.ufoAnimation.stage !== 'fly') return;
        if (Math.random() < 0.4) { 
            p.ufoAnimation.particles.push({
                x: p.ufoAnimation.ufoX + (Math.random() * 60 - 30) * p.scale,
                y: p.ufoAnimation.ufoY + 20 * p.scale,
                r: (Math.random() * 12 + 6) * p.scale,
                color: Math.random() > 0.5 ? '#FDE047' : '#F472B6',
                vy: (Math.random() * 3 + 2) * p.scale,
                vx: (Math.random() * 2 - 1) * p.scale,
                alpha: 1
            });
        }
        p.ufoAnimation.particles.forEach((part, idx) => {
            part.x += part.vx; part.y += part.vy; part.alpha -= 0.02;
            ctx.save(); ctx.globalAlpha = Math.max(0, part.alpha);
            ctx.fillStyle = part.color; ctx.beginPath(); ctx.arc(part.x, part.y, part.r, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            if (part.alpha <= 0) p.ufoAnimation.particles.splice(idx, 1);
        });
    }

    function gameLoop() {
        if (!isGameRunning) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#0F172A'); gradient.addColorStop(0.6, '#1E1B4B'); gradient.addColorStop(1, '#020617');   
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        let timeNow = Date.now();
        backgroundStars.forEach(star => {
            ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + Math.sin(timeNow * 0.003 + star.offset) * 0.6})`;
            ctx.beginPath(); ctx.arc(star.x * canvas.width, star.y * canvas.height, star.size, 0, Math.PI * 2); ctx.fill();
        });

        const elapsed = (Date.now() - startTime) / 1000;
        const currentBeatFloat = elapsed / SECONDS_PER_BEAT;
        const currentPhrase = Math.floor(currentBeatFloat / 8);
        const localBeat = currentBeatFloat % 8;
        let displayPhrase = Math.min(currentPhrase, currentPhrasesCount - 1);

        players.forEach(p => {
            document.getElementById(`score-display-p${p.id}`).innerText = `SCORE: ${p.score}`;
            document.getElementById(`combo-display-p${p.id}`).style.top = `${p.y - 180 * p.scale}px`;
            document.getElementById(`feedback-p${p.id}`).style.top = `${p.y - 100 * p.scale}px`;

            let statusEl = document.getElementById(`status-display-p${p.id}`);
            if (p.state === 'playing') {
                if (localBeat < 4) statusEl.innerText = Math.floor(localBeat) + 1 === 4 ? "GO!" : Math.floor(localBeat) + 1;
                else statusEl.innerText = "PLAYING";
            } else if (p.state === 'falling' || p.state === 'failed') {
                statusEl.innerText = "FAIL!";
            } else {
                statusEl.innerText = "CLEAR!!";
            }
        });

        let anyPlaying = players.some(p => p.state === 'playing');
        if (anyPlaying) {
            if (localBeat < 4) {
                let currentStep = Math.floor(localBeat) + 1;
                prepCounter.style.display = 'block';
                if (currentStep === 4) {
                    prepText.innerText = "GO!"; prepText.style.color = "#EC4899"; 
                } else {
                    prepText.innerText = currentStep; prepText.style.color = "#FBBF24"; 
                }
            } else {
                prepCounter.style.display = 'none';
            }
        } else {
            prepCounter.style.display = 'none';
        }

        players.forEach(p => {
            if (currentPhrase >= currentPhrasesCount && p.state === 'playing') {
                if (!p.ufoAnimation.active) {
                    p.ufoAnimation.active = true; p.ufoAnimation.timer = 0; p.ufoAnimation.stage = 'descend';
                    p.ufoAnimation.ufoY = p.y - 200 * p.scale; p.ufoAnimation.ufoX = START_LINE_X + 4 * BASE_UNIT;
                    p.state = 'escaping';
                    if (p.id === 1) playUfoSound(false); 
                }
            }
            
            globalPlatforms.forEach(plat => {
                if (plat.phrase === displayPhrase) {
                    let sx = START_LINE_X + plat.index * BASE_UNIT;
                    drawPlatform(plat, sx, p.y, p.scale);
                }
            });

            p.notes.forEach((n, idx) => {
                if (n.phrase === displayPhrase && !n.hit) {
                    let sx = START_LINE_X + n.index * BASE_UNIT + (n.subPos * BASE_UNIT);
                    const ny = p.y + 90 * p.scale;
                    
                    ctx.save(); ctx.translate(sx, ny); ctx.scale(p.scale, p.scale);
                    ctx.fillStyle = '#94A3B8'; ctx.strokeStyle = '#94A3B8'; 
                    
                    if (n.type === 'rest') {
                        ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-7, -35); ctx.lineTo(7, -20); ctx.lineTo(-5, -10); ctx.bezierCurveTo(12, -5, 10, 10, -7, 10); ctx.stroke();
                    } else {
                        ctx.beginPath(); ctx.ellipse(0, 0, 14, 10, -0.25, 0, Math.PI*2); ctx.fill(); ctx.fillRect(10, -42, 5, 42); 
                        if (n.beamToNext > 0) {
                            const next = p.notes[idx+1];
                            if (next && next.phrase === n.phrase && next.index === n.index) {
                                const nextX = START_LINE_X + next.index * BASE_UNIT + (next.subPos * BASE_UNIT);
                                const dist = (nextX - sx) / p.scale; 
                                ctx.fillRect(10, -42, dist + 5, 7);
                                if (n.beamToNext === 2) ctx.fillRect(10, -28, dist + 5, 7);
                            }
                        }
                    }
                    ctx.restore();
                }
                if (p.state === 'playing' && n.phrase === currentPhrase && !n.hit && !n.missed && currentBeatFloat > n.time + 0.3) { 
                    n.missed = true; if (n.type !== 'rest') takeDamage(p); 
                }
            });

            if (p.state === 'falling') {
                p.fallVy += 0.4 * p.scale; p.fallY += p.fallVy; p.rotation += 0.15; 
                drawPlayerRobot(p, p.x, p.y, p.fallY, p.rotation);
                if (p.y + p.fallY > canvas.height + 200) { p.state = 'failed'; checkGameEnd(); }
            } else if (p.state === 'playing') {
                let jumpHeight = 0;
                if (currentPhrase < currentPhrasesCount) {
                    if (localBeat < 3.0) {
                        p.x = START_LINE_X; jumpHeight = Math.sin((currentBeatFloat % 1) * Math.PI) * -45 * p.scale; 
                    } else if (localBeat >= 3.0 && localBeat < 7.0) {
                        let progress = localBeat - 3.0; p.x = START_LINE_X + progress * BASE_UNIT;
                        jumpHeight = Math.sin((progress % 1) * Math.PI) * -130 * p.scale; 
                    } else {
                        p.x = START_LINE_X + 4 * BASE_UNIT; jumpHeight = Math.sin((currentBeatFloat % 1) * Math.PI) * -45 * p.scale;
                    }
                } else {
                    p.x = START_LINE_X + 4 * BASE_UNIT; jumpHeight = 0; 
                }
                drawPlayerRobot(p, p.x, p.y, jumpHeight, 0);
            }

            if (p.state === 'escaping') {
                p.ufoAnimation.timer++; updateAndDrawParticles(p);
                let targetY = p.y - 140 * p.scale; 
                if (p.ufoAnimation.stage === 'descend') {
                    p.ufoAnimation.ufoY += (targetY - p.ufoAnimation.ufoY) * 0.05;
                    if (Math.abs(p.ufoAnimation.ufoY - targetY) < 2) {
                        p.ufoAnimation.stage = 'wave'; p.ufoAnimation.timer = 0; p.expression = 'happy'; p.isWaving = true; 
                    }
                } else if (p.ufoAnimation.stage === 'wave') {
                    if (p.ufoAnimation.timer > 70) {
                        p.ufoAnimation.stage = 'ascend'; p.ufoAnimation.timer = 0; p.isWaving = false; if(p.id===1) playUfoSound(true); 
                    }
                } else if (p.ufoAnimation.stage === 'ascend') {
                    p.ascendY -= 2 * p.scale; p.rotation += 0.08; 
                    if (p.y + p.ascendY < p.ufoAnimation.ufoY + 10 * p.scale) {
                        p.visible = false; p.ufoAnimation.stage = 'fly'; p.ufoAnimation.timer = 0; showFeedback(p, "SUCCESS ESCAPE!", "#FDE047");
                    }
                } else if (p.ufoAnimation.stage === 'fly') {
                    p.ufoAnimation.ufoY -= 12 * p.scale; p.ufoAnimation.ufoX += 3 * p.scale; 
                    if (p.ufoAnimation.ufoY < -150) { p.state = 'escaped'; checkGameEnd(); }
                }

                // 🌟 修復：在飛船尚未吸入完成前，繼續繪製站在原地或被吸走過程中的主角
                if (p.visible) {
                    drawPlayerRobot(p, p.x, p.y, 0, p.rotation);
                }
                
                drawUFO(p, p.ufoAnimation.ufoX, p.ufoAnimation.ufoY);
            }

            ctx.fillStyle = '#A3E635'; ctx.fillRect(0, p.y + 115 * p.scale, canvas.width, 15 * p.scale);
            ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, p.y + 130 * p.scale, canvas.width, 80 * p.scale);
            
            ctx.fillStyle = '#FBBF24';
            for (let i = 0; i < 5; i++) {
                let bx = START_LINE_X + i * BASE_UNIT; let by = p.y + 165 * p.scale;
                ctx.save(); ctx.translate(bx, by); ctx.scale(p.scale, p.scale);
                ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(12, 0); ctx.lineTo(0, 12); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill();
                ctx.restore();
            }
        });

        let anyPlayerActive = players.some(p => p.state === 'playing');
        if (anyPlayerActive && Math.floor(currentBeatFloat) > lastPlayedBeat) {
            playMetronomeSound(Math.floor(currentBeatFloat) % 4 === 0);
            lastPlayedBeat = Math.floor(currentBeatFloat);
        }

        requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => { 
        if (!isGameRunning) return;
        if (e.code === 'Space' || e.key === ' ') { 
            e.preventDefault(); 
            if(players[0]) handleInput(players[0]); 
        }
        if (gameMode === 'pvp' && e.code === 'Enter') { 
            e.preventDefault(); 
            if(players[1]) handleInput(players[1]); 
        }
    });

    canvas.addEventListener('touchstart', e => { 
        e.preventDefault(); 
        if (!isGameRunning) return;
        for(let i = 0; i < e.touches.length; i++) {
            if (gameMode === 'single') {
                if(players[0]) handleInput(players[0]);
            } else {
                if (e.touches[i].clientY < canvas.height / 2) {
                    if(players[0]) handleInput(players[0]);
                } else {
                    if(players[1]) handleInput(players[1]);
                }
            }
        }
    }, {passive: false});

</script>
</body>
</html>
